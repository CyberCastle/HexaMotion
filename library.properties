name=HexaMotion
version=1.0.0
author=CyberCastle with AI assistance from GitHub Copilot (GPT, Claude Opus, Gemini)
sentence=1:1 port of OpenSHC hexapod locomotion controller without ROS
paragraph=Near-complete port of OpenSHC (CSIRO Syropod High-level Controller) for MCU targets. Provides inverse kinematics using DH parameters and Jacobians, body pose and orientation control via IMU feedback, multiple gait planners (tripod, wave, ripple, metachronal), terrain adaptation, admittance control, FSR contact detection, and smart servo interface for hexapod robots with 6 legs and 3DOF per leg. Designed for Arduino Giga R1 (STM32H7).
category=Robotics
url=https://github.com/cybercastle/HexaMotion
architectures=mbed,mbed_portenta,mbed_nicla,mbed_giga
